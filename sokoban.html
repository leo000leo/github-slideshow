<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>推箱子 Sokoban</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    user-select: none;
    padding: 20px;
  }
  h1 { margin-bottom: 8px; font-size: 28px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
  .info {
    display: flex;
    gap: 20px;
    margin-bottom: 16px;
    font-size: 16px;
  }
  .info span { background: rgba(0,0,0,0.25); padding: 6px 14px; border-radius: 20px; }
  #board {
    display: grid;
    gap: 2px;
    background: #2c3e50;
    padding: 8px;
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .cell {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    border-radius: 4px;
    transition: transform 0.08s ease;
  }
  .wall   { background: #7f8c8d; }
  .floor  { background: #ecf0f1; }
  .target { background: #f9e79f; }
  .box    { background: #ecf0f1; }
  .box::after    { content: "📦"; }
  .box.on-target { background: #58d68d; }
  .box.on-target::after { content: "✅"; }
  .player::after { content: "🧑"; }
  .player.on-target { background: #f9e79f; }

  .controls {
    margin-top: 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: 8px 18px;
    border: none;
    border-radius: 20px;
    background: rgba(255,255,255,0.9);
    color: #333;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.1s;
  }
  button:hover { transform: translateY(-2px); background: #fff; }
  .hint { margin-top: 12px; font-size: 13px; opacity: 0.85; }
  .win-banner {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    z-index: 10;
  }
  .win-banner.show { display: flex; }
  .win-banner h2 { font-size: 48px; margin-bottom: 16px; }
</style>
</head>
<body>
  <h1>🎮 推箱子 Sokoban</h1>
  <div class="info">
    <span>关卡：<b id="level">1</b> / <b id="totalLevels">3</b></span>
    <span>步数：<b id="steps">0</b></span>
  </div>
  <div id="board"></div>
  <div class="controls">
    <button onclick="undo()">↶ 撤销 (Z)</button>
    <button onclick="resetLevel()">🔄 重玩 (R)</button>
    <button onclick="prevLevel()">⬅ 上一关</button>
    <button onclick="nextLevel()">下一关 ➡</button>
  </div>
  <div class="hint">使用 方向键 / WASD 移动 · Z 撤销 · R 重玩</div>

  <div class="win-banner" id="winBanner">
    <h2>🎉 过关！</h2>
    <button onclick="nextLevel()">下一关 ➡</button>
  </div>

<script>
// 地图符号：
// # 墙   . 目标点   $ 箱子   * 箱子在目标点上
// @ 玩家  + 玩家在目标点上   (空格) 地板
const LEVELS = [
  [
    "########",
    "#  .   #",
    "#  $   #",
    "#  @   #",
    "#      #",
    "#      #",
    "########",
  ],
  [
    "  #####  ",
    "###   ###",
    "#  $.$  #",
    "#  .@.  #",
    "#  $.$  #",
    "###   ###",
    "  #####  ",
  ],
  [
    "  ####   ",
    "###  ####",
    "#  $ $  #",
    "# # @ # #",
    "#  $ $  #",
    "###. .###",
    "  #...#  ",
    "  #####  ",
  ],
];

let levelIdx = 0;
let grid = [];        // 静态层: '#', '.', ' '
let boxes = [];       // 箱子坐标列表
let player = { r: 0, c: 0 };
let steps = 0;
let history = [];

function loadLevel(idx) {
  const raw = LEVELS[idx];
  grid = [];
  boxes = [];
  history = [];
  steps = 0;
  for (let r = 0; r < raw.length; r++) {
    const row = [];
    for (let c = 0; c < raw[r].length; c++) {
      const ch = raw[r][c];
      if (ch === '#') row.push('#');
      else if (ch === '.' || ch === '*' || ch === '+') row.push('.');
      else row.push(' ');
      if (ch === '$' || ch === '*') boxes.push({ r, c });
      if (ch === '@' || ch === '+') player = { r, c };
    }
    grid.push(row);
  }
  document.getElementById('level').textContent = idx + 1;
  document.getElementById('totalLevels').textContent = LEVELS.length;
  document.getElementById('winBanner').classList.remove('show');
  render();
}

function render() {
  const board = document.getElementById('board');
  const rows = grid.length;
  const cols = Math.max(...grid.map(r => r.length));
  board.style.gridTemplateColumns = `repeat(${cols}, 44px)`;
  board.innerHTML = '';

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const base = grid[r][c] || ' ';
      if (base === '#') cell.classList.add('wall');
      else if (base === '.') cell.classList.add('target');
      else cell.classList.add('floor');

      const box = boxes.find(b => b.r === r && b.c === c);
      if (box) {
        cell.classList.add('box');
        if (base === '.') cell.classList.add('on-target');
      }
      if (player.r === r && player.c === c) {
        cell.classList.add('player');
        if (base === '.') cell.classList.add('on-target');
      }
      board.appendChild(cell);
    }
  }
  document.getElementById('steps').textContent = steps;
  checkWin();
}

function move(dr, dc) {
  const nr = player.r + dr, nc = player.c + dc;
  if ((grid[nr] || [])[nc] === '#') return;

  const boxIdx = boxes.findIndex(b => b.r === nr && b.c === nc);
  if (boxIdx >= 0) {
    const br = nr + dr, bc = nc + dc;
    if ((grid[br] || [])[bc] === '#') return;
    if (boxes.some(b => b.r === br && b.c === bc)) return;
    history.push({ player: { ...player }, boxes: boxes.map(b => ({ ...b })) });
    boxes[boxIdx] = { r: br, c: bc };
  } else {
    history.push({ player: { ...player }, boxes: boxes.map(b => ({ ...b })) });
  }
  player = { r: nr, c: nc };
  steps++;
  render();
}

function checkWin() {
  const allOn = boxes.every(b => grid[b.r][b.c] === '.');
  if (allOn && boxes.length > 0) {
    setTimeout(() => document.getElementById('winBanner').classList.add('show'), 200);
  }
}

function undo() {
  if (!history.length) return;
  const prev = history.pop();
  player = prev.player;
  boxes = prev.boxes;
  steps = Math.max(0, steps - 1);
  render();
}
function resetLevel() { loadLevel(levelIdx); }
function nextLevel() {
  if (levelIdx < LEVELS.length - 1) { levelIdx++; loadLevel(levelIdx); }
  else { alert('🏆 已通关全部关卡！'); }
}
function prevLevel() {
  if (levelIdx > 0) { levelIdx--; loadLevel(levelIdx); }
}

document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (['arrowup','w'].includes(k)) { move(-1, 0); e.preventDefault(); }
  else if (['arrowdown','s'].includes(k)) { move(1, 0); e.preventDefault(); }
  else if (['arrowleft','a'].includes(k)) { move(0, -1); e.preventDefault(); }
  else if (['arrowright','d'].includes(k)) { move(0, 1); e.preventDefault(); }
  else if (k === 'z') undo();
  else if (k === 'r') resetLevel();
});

loadLevel(0);
</script>
</body>
</html>
